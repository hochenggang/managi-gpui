[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/ssh",
    "crates/term",
    "crates/ui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/hochenggang/managi-gpui"

[workspace.dependencies]
gpui-kit = "=0.11.0"
alacritty_terminal = "=0.26.0"
russh = { version = "=0.65.4", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "=4.0.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
directories = "6"
keyring = { version = "3.4", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
# 体积优先：Windows 单文件目标 ≤25 MB。
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
