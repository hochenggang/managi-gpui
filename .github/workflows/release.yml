name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            artifact: managi-gpui-windows-x64
            binary: target/release/managi-gpui.exe
            asset: managi-gpui-windows-x64.exe
          - name: linux-x64
            os: ubuntu-24.04
            artifact: managi-gpui-linux-x64
            binary: target/release/managi-gpui
            asset: managi-gpui-linux-x64
          - name: macos-arm64
            os: macos-15
            artifact: managi-gpui-macos-arm64
            binary: target/release/managi-gpui
            asset: managi-gpui-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev wayland-protocols libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev libzstd-dev libasound2-dev \
            libvulkan-dev libvulkan1 vulkan-validationlayers \
            libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 构建发布版
        run: cargo build --release --bins --locked

      - name: 校验二进制可运行（无窗口）
        run: cargo run --locked --release -p managi-app --bin managi-gpui-selftest

      - name: 准备平台命名产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: 准备平台命名产物（Unix）
        if: runner.os != 'Windows'
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: 计算 SHA256（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Set-Content "${{ matrix.asset }}.sha256"

      - name: 计算 SHA256（Unix）
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: 上传校验和
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-sha256
          path: ${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          fail_on_unmatched_files: true
          body: |
            Managi GPUI 首个可运行版本：Rust + GPUI 原生 SSH 客户端，无 WebView。

            - SSH 终端：密码/私钥、彩色与 CJK、滚轮回看、粘贴复制、断线重连
            - SFTP：浏览、新建目录、上传、下载、删除文件与空目录
            - 快捷命令面板：12 条常用运维命令
            - 批量执行：多主机并发、逐主机退出码与输出、单机/全部停止

            下载后请用同名 `.sha256` 校验。Windows 未签名，SmartScreen 提示时选择“仍要运行”。
            已知限制与使用说明见 README。
          generate_release_notes: true
